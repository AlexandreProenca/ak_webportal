HIKASHOP_API_KEY_NOT_SET="A chave de API não está definida nas configurações do plugin HikaShop Massaction. Você pode defini-la nas configurações do plugin através do Gerenciador de Plugins do Joomla. Sem ela, apenas endpoints públicos estarão disponíveis."
ON_HTTP_REQUEST="Em uma requisição HTTP (webhook)"
HIKASHOP_API="API"
HIKASHOP_API_DESC="Se quiser disponibilizar endpoints de API para ações em massa, você precisa ativar esta opção. Depois disso, poderá usar o gatilho 'Em uma requisição HTTP' em suas ações em massa para criar endpoints."
HIKASHOP_API_KEY="Chave de API"
HIKASHOP_API_KEY_DESC="Insira aqui uma chave de API que será usada para autenticar as solicitações feitas para ações em massa com um gatilho 'em solicitação HTTP' ou 'em solicitação MCP'. Você precisará fornecer essa mesma chave como um parâmetro na URL ao fazer uma solicitação ao endpoint das ações em massa. As solicitações HTTP para os endpoints deverão ter um cabeçalho 'X-API-KEY' com o valor sendo a chave da API. Se você deixar essa configuração vazia, apenas os endpoints públicos estarão acessíveis sem qualquer autenticação."
HIKASHOP_ENDPOINT="Caminho do endpoint"
HIKASHOP_ENDPOINT_EXPLANATION="O caminho do endpoint é o endereço a partir da raiz do seu site para o qual as requisições devem ser enviadas. Sem etiqueta, todos os itens serão considerados. Se uma etiqueta for adicionada, ela deve corresponder ao nome de uma coluna da tabela — nesse caso, apenas os itens correspondentes ao valor na requisição serão processados. Por exemplo, com o caminho /products/api/{product_name} e uma requisição para https://seusite.com/products/api/hikashop, apenas produtos com o nome 'hikashop' serão processados."
HIKASHOP_API_NOT_ACTIVATED="A opção 'API' do plugin HikaShop Massaction não está ativada. Ative-a no Gerenciador de Plugins do Joomla se quiser disponibilizar endpoints de API."
HIKASHOP_ENDPOINT_ACCESS="Acesso ao endpoint"
HIKASHOP_ENDPOINT_ACCESS_DESC="Você pode escolher aqui ter um endpoint público, acessível por qualquer pessoa, ou um endpoint privado que exigirá uma chave de API para ser acessado (nesse segundo caso, as solicitações HTTP para o endpoint deverão ter um cabeçalho 'X-API-KEY' com o valor sendo a chave da API configurada no plugin)."
SELECT_A_FILE="Selecionar um arquivo"
WITH_API_KEY="com chave de API"
HIKASHOP_PUBLIC="público"
HIKASHOP_ENDPOINT_ACCESS_DENIED="Você não tem permissão para acessar este endpoint. Forneça uma chave de API válida na requisição."
HIKASHOP_ENDPOINT_ACTIONS="Ações permitidas"
HIKASHOP_POST_DATA_CREATE="Criar item"
HIKASHOP_POST_DATA_UPDATE="Atualizar item"
HIKASHOP_LOAD_DATA="Carregar dados do item"
HIKASHOP_ENDPOINT_ACTIONS_EXPLANATION="Você pode escolher aqui permitir que o endpoint crie novos elementos, atualize elementos existentes, obtenha dados de elementos ou ambos. Se escolher 'criar', o endpoint só poderá criar novos elementos. Se escolher 'atualizar', o endpoint só poderá atualizar elementos existentes. Se escolher 'criar e atualizar', o endpoint poderá criar e atualizar elementos. Ao criar e atualizar elementos, a ação em massa levará em conta os dados fornecidos na solicitação POST. Nesse caso, os dados devem ser fornecidos como JSON no corpo da solicitação. O JSON deve ser um objeto com as chaves sendo os nomes das colunas da tabela e os valores sendo os valores a serem definidos para essas colunas. Se você quiser fornecer dados para tabelas vinculadas, como preços, categorias, imagens, etc., você pode fornecer os dados como uma matriz de objetos com as chaves sendo os nomes das colunas da tabela vinculada e os valores sendo os valores a serem definidos para essas colunas. O formato exato é o aceito pela função de salvamento da classe de dados do HikaShop. Você pode encontrar mais informações sobre isso na documentação do desenvolvedor do HikaShop."
HIKASHOP_INVALID_JSON_IN_POST_DATA="JSON inválido nos dados POST"
HIKASHOP_ERROR_UNKNOW_WHEN_UPDATING_ELEMENT_WITH_POST_DATA="Ocorreu um erro desconhecido ao atualizar o item com os dados enviados"
HIKASHOP_CREATE_OF_ELEMENT_NOT_ALLOWED="Criação de novos itens não é permitida para este endpoint"
HIKASHOP_LOAD_OF_ELEMENTS_NOT_ALLOWED="Carregamento de itens não é permitido para este endpoint"
HIKASHOP_UPDATE_OF_ELEMENT_NOT_ALLOWED="Atualização de itens não é permitida para este endpoint"
HIKASHOP_NO_ELEMENT_FOUND="Nenhum item encontrado"
VENDOR_ONLY="Somente para o vendedor"
PUBLIC_ONLY="Somente público"
HIKASHOP_API_DATA_ACCESS="Acesso aos dados"
HIKASHOP_API_DATA_ACCESS_DESC="Com acesso 'Somente público', o endpoint poderá acessar apenas dados publicados (como produtos ou categorias). Com 'Somente para o vendedor', o endpoint terá acesso a todos os dados pertencentes ao vendedor. Use com cautela — pode expor informações confidenciais."
SEND_HTTP_REQUEST="Enviar requisição HTTP"
HIKASHOP_URL_EXPLANATION="Insira aqui a URL para a qual a solicitação HTTP será enviada. Você pode usar tags nessa URL que serão substituídas pelos valores correspondentes do elemento quando a solicitação for enviada. Por exemplo, se você usar a URL https://seuservicodecontabilidade.com/order/invoice/{order_id}?status={order_status} e a ação em massa estiver processando um pedido com o id '12' e o status 'confirmed', então a solicitação será enviada para a URL https://seuservicodecontabilidade.com/order/invoice/12?status=confirmed"
HIKASHOP_METHOD="Método"
HIKASHOP_METHOD_EXPLANATION="Escolha o método HTTP que será usado para a requisição."
HIKASHOP_AUTHENTICATION="Autenticação"
OAUTH2="OAuth2"
HIKASHOP_BASIC="Básica"
HIKASHOP_AUTHENTICATION_EXPLANATION="Selecione aqui o tipo de autenticação a ser usada para a solicitação. Se você selecionar 'Nenhum', nenhuma autenticação será usada. Se selecionar 'Básico', você precisará fornecer um nome de usuário e uma senha que serão enviados na solicitação usando o cabeçalho de autenticação básica. Se selecionar 'OAuth2', você precisará configurar uma URL, cabeçalho e POST para a solicitação do token de acesso. O sistema usará essas informações para obter um token de acesso que será incluído na solicitação HTTP principal usando a autenticação Bearer."
HIKASHOP_TOKEN_URL="URL do token"
HIKASHOP_TOKEN_URL_EXPLANATION="Insira aqui a URL para a qual a solicitação para obter o token de acesso será enviada. O sistema enviará uma primeira solicitação HTTP para essa URL para obter o token de acesso antes de enviar a solicitação real para a URL configurada na configuração 'URL', com o token de acesso adicionado automaticamente ao cabeçalho bearer de autorização."
HIKASHOP_ACCESS_TOKEN_HEADERS="Cabeçalhos da requisição de token"
HIKASHOP_ACCESS_TOKEN_HEADERS_EXPLANATION="Você pode inserir aqui os cabeçalhos para enviar ao solicitar o token de acesso. Se você não precisar de nenhum cabeçalho específico, pode deixar essa configuração vazia."
HIKASHOP_ACCESS_TOKEN_METHOD="Método da requisição de token"
HIKASHOP_ACCESS_TOKEN_METHOD_EXPLANATION="Escolha o método HTTP usado para obter o token de acesso."
HIKASHOP_ACCESS_TOKEN_POST="Dados POST para o token"
HIKASHOP_ACCESS_TOKEN_POST_EXPLANATION="Você pode inserir aqui os dados para enviar no corpo da solicitação ao solicitar o token de acesso. Se você não precisar enviar nenhum dado, pode deixar essa configuração vazia."
