TAXCLOUD_EXEMPTION_FLAG_DESC="Se alguns dos seus clientes estiverem isentos de impostos, pode usar esta opção para ignorar o cálculo de impostos para eles. Para que isso aconteça, precisa criar um campo personalizado da tabela 'user' e do tipo dropdown único, ou radio, e com os valores sim e não, ou 1 e 0. Certifique-se de que a definição de exibição frontend do campo personalizado está desativada. Finalmente, pode inserir o nome da coluna desse campo personalizado nesta definição. Edite a entrada do cliente isento no seu backend HikaShop, e selecione sim ou 1 no campo personalizado para isentar o usuário de impostos."
