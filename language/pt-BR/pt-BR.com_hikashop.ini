PLEASE_FILL_IN_ALL_THE_FIELDS="Preencha todos os campos e forneça informações válidas"
TAKE_INTO_ACCOUNT_EXTRA_FEES="Ter em conta taxas extra"
CANCEL_AND_CHOOSE_ANOTHER_PAYMENT_METHOD="Cancelar e escolher outro método de pagamento"
IS_BUNDLE="É um bundle?"
IS_BUNDLE_DESC="O seu produto é um grupo de um produto principal com outros produtos diferentes, vendidos juntos como um pacote por um único preço? Pode inserir aqui os valores 'yes' ou 'no' e aplicar-se-á a todos os produtos. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/6324449"
MULTIPACK="Multipacote"
MULTIPACK_DESC="Com este parâmetro pode fornecer o número de produtos idênticos incluídos num produto (Por exemplo, se vende pacotes de 3 garrafas de vinho, quer inserir '3'). Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/6324488"
ENERGY_EFFICIENCY_CLASS="Classe de eficiência energética"
ENERGY_EFFICIENCY_CLASS_DESC="Pode inserir aqui a classe de eficiência energética dos seus produtos. Os valores possíveis são: A+++, A++, A+, A, B, C, D, E, F e G. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/7562785"
MIN_ENERGY_EFFICIENCY_CLASS="Classe de eficiência energética mínima"
MIN_ENERGY_EFFICIENCY_CLASS_DESC="Pode inserir aqui a classe de eficiência energética mínima da sua categoria de produtos. Os valores possíveis são: A+++, A++, A+, A, B, C, D, E, F e G. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/7562785"
MAX_ENERGY_EFFICIENCY_CLASS="Classe de eficiência energética máxima"
MAX_ENERGY_EFFICIENCY_CLASS_DESC="Pode inserir aqui a classe de eficiência energética máxima da sua categoria de produtos. Os valores possíveis são: A+++, A++, A+, A, B, C, D, E, F e G. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/7562785"
UNIT_PRICING_MEASURE="Medida de preço unitário"
UNIT_PRICING_MEASURE_DESC="Pode inserir aqui a medida de preço unitário dos seus produtos. Deve ser um número seguido de uma unidade de medida. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/6324455"
UNIT_PRICING_BASE_MEASURE="Medida base de preço unitário"
UNIT_PRICING_BASE_MEASURE_DESC="Pode inserir aqui a medida base de preço unitário dos seus produtos. Deve ser um número seguido de uma unidade de medida. Se inserir aqui o nome da coluna de um campo personalizado de produto, usará o valor do campo personalizado para cada produto permitindo ter um valor diferente para cada produto. Pode ler mais sobre isto aqui: https://support.google.com/merchants/answer/6324490"
TRACKING="rastreamento"
HIKA_AVAILABILITY_DATE="Data de disponibilidade"
HIKA_AVAILABILITY_DATE_DESC="Você pode inserir aqui o nome da coluna de um campo personalizado de produto. Nesse caso, quando um produto estiver fora de estoque e este campo personalizado estiver preenchido, a 'disponibilidade' do produto será 'pedido' em vez de 'fora de estoque'. O formato desse campo deve ser YYYY-MM-DDThh:mmZ ou YYYY-MM-DD ou carimbo de data/hora unix. Observe também que, se o produto tiver uma data de início de vendas no futuro, a disponibilidade será forçada para 'pré-venda', com a data de disponibilidade sendo a data de início das vendas automaticamente, mesmo que essa configuração não esteja preenchida."
GEOLOCATION_RETAINING_PERIOD="Período de retenção de geolocalização"
GEOLOCATION_RETAINING_PERIOD_DESC="Insira aqui o número de segundos (padrão é 31556952, que é um ano) para manter a geolocalização de um endereço IP armazenado na base de dados"

