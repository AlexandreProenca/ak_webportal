CHECKOUT_LINK_TEMPLATE="Template de link de checkout"
CHECKOUT_LINK_TEMPLATE_DESC="Se habilitado, o plugin incluirá a URL de adição ao carrinho para cada produto do feed (esta URL adicionará o produto ao carrinho e redirecionará o usuário para a finalização do pedido em caso de sucesso). Se esta configuração estiver definida para 'Por base de produto', o plugin buscará o valor de um campo personalizado da tabela 'product' com o nome da coluna 'checkout_link_template' para cada produto. Se esse valor for diferente de 0, o plugin adicionará a URL de adição ao carrinho para esse produto."
